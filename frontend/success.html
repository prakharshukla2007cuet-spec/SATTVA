<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Success | SATTVA</title>
  <script src="api.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="success.css">
</head>
<body>

  <div class="float-shape s-shape-1" aria-hidden="true"></div>
  <div class="float-shape s-shape-2" aria-hidden="true"></div>
  <div class="logo-bg"></div>

  <div class="content">
    <h1 id="success-message">Thank You!</h1>
    <p id="success-detail">Your form has been submitted successfully.<br>We appreciate your time and interest in SATTVA.</p>
    <a href="index.html" class="home-btn">Back to Homepage</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role');
    if (role === 'instructor') {
      document.getElementById('success-message').innerText = 'Application Received!';
      document.getElementById('success-detail').innerHTML = "Thank you for applying to teach at SATTVA.<br>We'll review your profile and get back to you soon.";
    }
  </script>
</body>
</html>
